name: Deploy Cloudflare Worker

on:
  # The current Next/OpenNext Worker bundle exceeds Cloudflare Workers Free size
  # limits, so keep this manual until the account is upgraded or the bundle is
  # split below the free limit.
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_APP_URL: https://shortee.app
      NEXT_PUBLIC_SITE_URL: https://shortee.app
      CAPACITOR_SERVER_URL: https://shortee.app
      NEXT_PUBLIC_BILLING_ENABLED: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.STRIPE_SECRET_KEY != '' && secrets.STRIPE_WEBHOOK_SECRET != '' && secrets.STRIPE_PREMIUM_MONTHLY_PRICE_ID != '' && secrets.STRIPE_PREMIUM_YEARLY_PRICE_ID != '' }}
      NEXT_PUBLIC_ENABLE_DEV_PREMIUM_OVERRIDE: 'false'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_REVENUECAT_API_KEY_APPLE: ${{ secrets.NEXT_PUBLIC_REVENUECAT_API_KEY_APPLE }}
      NEXT_PUBLIC_REVENUECAT_API_KEY_GOOGLE: ${{ secrets.NEXT_PUBLIC_REVENUECAT_API_KEY_GOOGLE }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      VIEW_COUNT_SECRET: ${{ secrets.VIEW_COUNT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PREMIUM_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PREMIUM_MONTHLY_PRICE_ID }}
      STRIPE_PREMIUM_YEARLY_PRICE_ID: ${{ secrets.STRIPE_PREMIUM_YEARLY_PRICE_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare app origin
        run: node scripts/verify-cloudflare-app-origin.mjs

      - name: Run tests
        run: npm run test:run

      - name: Build Next.js
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Prepare Cloudflare runtime secrets
        run: node scripts/write-cloudflare-secrets-file.mjs .cloudflare-secrets.json

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --secrets-file .cloudflare-secrets.json
